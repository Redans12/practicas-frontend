<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejercicio 3 - Formulario</title>
</head>

<body>
    <form action="#" method="get" target="_blank">
        <div>
            <label for="name">Name</label>
            <input type="text" id="name" name="name" autocomplete="given-name" required>
        </div>

        <div>
            <label for="last">Last</label>
            <input type="text" id="last" name="last" autocomplete="family-name" required>
        </div>

        <div>
            <label for="age">Age</label>
            <input type="number" id="age" name="age" min="0" max="120" required>
        </div>

        <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required>
        </div>

        <fieldset>
            <legend>Agree to the terms? (radio)</legend>
            <div>
                <input type="radio" id="terms-yes" name="terms-radio" value="yes" required>
                <label for="terms-yes">Yes</label>
            </div>
            <div>
                <input type="radio" id="terms-no" name="terms-radio" value="no">
                <label for="terms-no">No</label>
            </div>
        </fieldset>

        <div>
            <input type="checkbox" id="terms-check" name="terms-check" value="agree" required>
            <label for="terms-check">Agree to the terms?</label>
        </div>

        <button type="submit">Submit</button>
    </form>
</body>

</html>
