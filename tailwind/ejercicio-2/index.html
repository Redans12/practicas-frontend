<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card de producto - Theme</title>
    <link rel="stylesheet" href="../output.css" />
  </head>
  <body class="bg-gray-100 p-6 font-sans">
    <article
      class="w-full md:max-w-sm mx-auto bg-white rounded-lg shadow-md overflow-hidden"
    >
      <img
        src="https://via.placeholder.com/400x250"
        alt="Teclado mecánico inalámbrico"
        class="w-full"
      />
      <div class="p-4">
        <h2 class="text-lg font-bold text-gray-800">Teclado mecánico</h2>
        <p class="text-sm text-gray-600 mt-1">
          Teclado inalámbrico con switches táctiles y retroiluminación RGB.
        </p>
        <p class="text-xl font-semibold text-gray-900 mt-3">$45.00</p>
        <button
          class="mt-4 w-full rounded-md bg-primary text-white py-2 font-medium hover:bg-primary-dark focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 active:scale-95 transition"
        >
          Comprar
        </button>
      </div>
    </article>
  </body>
</html>
